apiVersion: apps/v1
kind: Deployment
metadata:
  name: observatorio-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: observatorio-api }
  template:
    metadata:
      labels: { app: observatorio-api }
    spec:
      containers:
        - name: api
          image: observatorio-backend
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: observatorio-config }
            - secretRef: { name: observatorio-segredos }
          readinessProbe:
            httpGet: { path: /saude, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /saude, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: observatorio-api
spec:
  selector: { app: observatorio-api }
  ports:
    - port: 80
      targetPort: 8000
