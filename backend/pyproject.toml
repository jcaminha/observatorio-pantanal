[project]
name = "observatorio-pantanal"
version = "0.1.0"
description = "Backend do Observatório de Dados Públicos do Pantanal (INPP): ETL, banco espaço-temporal, catálogo FAIR e API REST"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
gee = ["earthengine-api>=1.4"]
dev = ["pytest>=8"]

[project.scripts]
observatorio = "observatorio.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["observatorio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
